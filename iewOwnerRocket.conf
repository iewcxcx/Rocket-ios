# 表示当其他所有规则都匹配不到时才使用FINAL规则的策略。
FINAL,🚀 手动切换

[Host]
# 域名指定本地值：
# example.com = 1.2.3.4

# 域名指定 DNS 服务器：
# example.com = server:1.2.3.4

# wifi名称指定 DNS 服务器，如需指定多个 DNS，可用逗号分隔：
# ssid:wifi名称 = server:1.2.3.4

*.apple.com = server:https://doh.pub/dns-query,https://dns.alidns.com/dns-query
*.icloud.com = server:https://doh.pub/dns-query,https://dns.alidns.com/dns-query
localhost = 127.0.0.1

[URL Rewrite]
# Google搜索引擎防跳转的重写。
'^https?://(www.)?g.cn' 'https://www.google.com' 302
'^https?://(www.)?google.cn' 'https://www.google.com' 302

[MITM]
